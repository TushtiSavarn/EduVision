{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduVision</title>
    <link rel="icon" href="{% static 'accounts/images/logo.jpg' %}">

    <style>
        /* ---------- GLOBAL ---------- */
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            /* Matching your Home Page Gradient */
            background: linear-gradient(135deg, #081a33 0%, #0d2a57 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e6f0ff;
        }

        /* ---------- WRAPPER ---------- */
        .auth-wrapper {
            width: 95%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        /* ---------- LEFT PANEL (The "Welcome" Side) ---------- */
        .auth-left {
            background: linear-gradient(145deg, #052695, #5483B3);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .auth-left img {
            width: 90px;
            height: 90px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            object-fit: cover;
        }

        .auth-left h1 {
            font-size: 32px;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .auth-left p {
            opacity: 0.9;
            font-size: 16px;
            line-height: 1.5;
        }

        /* ---------- RIGHT PANEL (The Form Side) ---------- */
        .auth-right {
            padding: 60px 50px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-right h2 {
            color: #fff;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-right p.subtitle {
            color: #9fb3d9;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ---------- INPUTS ---------- */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #9fb3d9;
            font-size: 13px;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            border-color: #5483B3;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(84, 131, 179, 0.2);
            outline: none;
        }

        /* ---------- BUTTON ---------- */
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #052695, #5483B3);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(5, 38, 149, 0.4);
            filter: brightness(1.1);
        }

        /* ---------- ERROR ---------- */
        .error-msg {
            margin-top: 20px;
            color: #ff8e8e;
            font-size: 14px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #5483B3;
        }

        /* ---------- ANIMATION ---------- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- RESPONSIVE ---------- */
        @media(max-width: 768px) {
            .auth-wrapper {
                grid-template-columns: 1fr;
                width: 90%;
            }
            .auth-left { padding: 40px 20px; }
            .auth-right { padding: 40px 30px; }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-left">
        <img src="{% static 'accounts/images/logo.jpg' %}" alt="logo">
        <h1>EduVision</h1>
        <p>Unlock Your Academic Potential.<br>Predict Before You Perform.</p>
    </div>

    <div class="auth-right">
        <h2>Welcome Back 👋</h2>
        <p class="subtitle">Please enter your details to sign in.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="e.g. alex@eduvision.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Sign In</button>

            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}
        </form>

        <div class="footer">
            © 2026 EduVision. All rights reserved.
        </div>
    </div>

</div>

</body>
</html>
